<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%">
  <defs>
    <style>
      @keyframes sweepRpm {
        0% { transform: translateX(0px); }
        50% { transform: translateX(520px); }
        100% { transform: translateX(0px); }
      }
      @keyframes shiftLightSeq {
        0%, 100% { opacity: 0.15; }
        35% { opacity: 0.3; }
        70% { opacity: 1; filter: drop-shadow(0 0 6px #ff0055); }
      }
      @keyframes vtecAlert {
        0%, 45% { opacity: 0.1; transform: scale(0.95); }
        50%, 85% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 10px #ff2a5f); }
        100% { opacity: 0.1; transform: scale(0.95); }
      }
      @keyframes drawCurve {
        0% { stroke-dashoffset: 1400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }

      .bg { fill: #080b10; rx: 12px; stroke: #1f293e; stroke-width: 2; }
      .grid { stroke: #161f30; stroke-width: 1; stroke-dasharray: 4 4; }
      .hud-line { stroke: #00f0ff; stroke-width: 1; opacity: 0.3; }
      .text-title { fill: #f0f6fc; font-family: 'Segoe UI', monospace, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
      .text-sub { fill: #6b7c96; font-family: 'Segoe UI', monospace, sans-serif; font-size: 11px; }
      .text-val { fill: #00f0ff; font-family: monospace; font-size: 16px; font-weight: bold; }
      
      .led-green { fill: #10b981; animation: shiftLightSeq 3s infinite; }
      .led-yellow { fill: #f59e0b; animation: shiftLightSeq 3s infinite 0.6s; }
      .led-red { fill: #ef4444; animation: shiftLightSeq 3s infinite 1.2s; }
      
      .torque-path {
        fill: none;
        stroke: url(#dynoGrad);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 1400;
        animation: drawCurve 6s ease-in-out infinite;
      }
      
      .scanner-group {
        animation: sweepRpm 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .vtec-badge {
        transform-origin: center;
        animation: vtecAlert 6s ease-in-out infinite;
      }
    </style>

    <linearGradient id="dynoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="55%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>

    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="850" height="440" class="bg" />

  <g transform="translate(30, 25)">
    <text x="0" y="15" class="text-title">HONDA K20A i-VTEC TELEMETRY ENGINE</text>
    <text x="0" y="32" class="text-sub">ENGINE DYNAMICS • SHAFT POWER • CAM PHASE DIAGNOSTIC</text>
    
    <g transform="translate(480, 5)">
      <rect x="0" y="0" width="310" height="28" fill="#0d1520" rx="6" stroke="#1f293e" />
      <circle cx="20" cy="14" r="7" class="led-green" />
      <circle cx="45" cy="14" r="7" class="led-green" />
      <circle cx="70" cy="14" r="7" class="led-green" />
      <circle cx="95" cy="14" r="7" class="led-yellow" />
      <circle cx="120" cy="14" r="7" class="led-yellow" />
      <circle cx="145" cy="14" r="7" class="led-yellow" />
      <circle cx="170" cy="14" r="7" class="led-red" />
      <circle cx="195" cy="14" r="7" class="led-red" />
      <circle cx="220" cy="14" r="7" class="led-red" />
      <circle cx="255" cy="14" r="9" class="led-red" style="filter: drop-shadow(0 0 8px #ff0055);" />
      <text x="275" y="18" font-family="monospace" font-size="10" fill="#ef4444" font-weight="bold">SHIFT</text>
    </g>
  </g>

  <line x1="30" y1="75" x2="820" y2="75" class="hud-line" />

  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="150" height="65" fill="#0c121d" rx="6" stroke="#162234" />
    <text x="12" y="20" class="text-sub">VALVE TIMING</text>
    <text x="12" y="45" class="text-val">i-VTEC VTC</text>

    <rect x="0" y="75" width="150" height="65" fill="#0c121d" rx="6" stroke="#162234" />
    <text x="12" y="95" class="text-sub">PEAK TORQUE</text>
    <text x="12" y="120" class="text-val" fill="#eab308">215 Nm</text>

    <rect x="0" y="150" width="150" height="65" fill="#0c121d" rx="6" stroke="#162234" />
    <text x="12" y="170" class="text-sub">MAX POWER</text>
    <text x="12" y="195" class="text-val" fill="#ff0055">165 kW</text>

    <g class="vtec-badge" transform="translate(0, 225)">
      <rect x="0" y="0" width="150" height="55" fill="#2a0813" rx="6" stroke="#ff0055" />
      <text x="75" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ff0055" text-anchor="middle">⚡ VTEC SOLENOID</text>
      <text x="75" y="42" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ENGAGED</text>
    </g>
  </g>

  <g transform="translate(210, 95)">
    <rect x="0" y="0" width="610" height="280" fill="#090e17" rx="8" stroke="#162234" />
    <line x1="0" y1="50" x2="610" y2="50" class="grid" />
    <line x1="0" y1="100" x2="610" y2="100" class="grid" />
    <line x1="0" y1="150" x2="610" y2="150" class="grid" />
    <line x1="0" y1="200" x2="610" y2="200" class="grid" />
    <line x1="0" y1="250" x2="610" y2="250" class="grid" />

    <line x1="100" y1="0" x2="100" y2="280" class="grid" />
    <line x1="200" y1="0" x2="200" y2="280" class="grid" />
    <line x1="300" y1="0" x2="300" y2="280" class="grid" />
    <line x1="420" y1="0" x2="420" y2="280" class="grid" />
    <line x1="520" y1="0" x2="520" y2="280" class="grid" />

    <path d="M 20 250 Q 100 230, 150 180 T 280 150 Q 360 140, 420 100 Q 450 40, 500 35 T 550 50 Q 580 80, 600 130" class="torque-path" />

    <g transform="translate(420, 100)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="0" cy="0" r="4" fill="#ff0055" />
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#ff0055" stroke-width="1" />
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#ff0055" stroke-width="1" />
      <text x="15" y="-12" font-family="monospace" font-size="11" font-weight="bold" fill="#ff0055">5,800 RPM (High-Cam Lift)</text>
    </g>

    <text x="20" y="300" class="text-sub">1000</text>
    <text x="100" y="300" class="text-sub">2500</text>
    <text x="200" y="300" class="text-sub">4000</text>
    <text x="300" y="300" class="text-sub">5000</text>
    <text x="420" y="300" font-family="monospace" font-size="11" font-weight="bold" fill="#ff0055">5800 (VTEC)</text>
    <text x="520" y="300" class="text-sub">7500</text>
    <text x="580" y="300" font-family="monospace" font-size="11" font-weight="bold" fill="#ef4444">8400 (REDLINE)</text>

    <g class="scanner-group" transform="translate(20, 0)">
      <line x1="0" y1="0" x2="0" y2="280" stroke="#00f0ff" stroke-width="2" style="filter: drop-shadow(0 0 8px #00f0ff);" />
      <rect x="-30" y="0" width="30" height="280" fill="url(#scanGlow)" />
      
      <g transform="translate(-35, 235) scale(0.8)">
        <path d="M 0 15 L 12 12 L 25 5 L 45 3 L 65 10 L 80 12 L 95 15 L 100 22 L 0 22 Z" fill="#00f0ff" opacity="0.2" />
        <path d="M 0 15 Q 25 2, 48 3 T 80 12 L 100 22" fill="none" stroke="#00f0ff" stroke-width="2" style="filter: drop-shadow(0 0 5px #00f0ff);" />
        <circle cx="20" cy="22" r="6" fill="#090e17" stroke="#00f0ff" stroke-width="2" />
        <circle cx="80" cy="22" r="6" fill="#090e17" stroke="#00f0ff" stroke-width="2" />
        <polygon points="100,16 125,12 125,24 100,20" fill="#00f0ff" opacity="0.4" />
      </g>
    </g>
  </g>

  <g transform="translate(30, 410)">
    <text x="0" y="0" class="text-sub">FACULTY OF COMPUTING &amp; INFORMATICS (FCI) • MULTIMEDIA UNIVERSITY</text>
    <text x="790" y="0" class="text-sub" text-anchor="end">C++17 ENGINE SIMULATION</text>
  </g>
</svg>
